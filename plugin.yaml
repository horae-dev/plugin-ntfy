# Written by `uv run python -m horae_ntfy --manifest > plugin.yaml`; tests/test_manifest.py
# checks it is what the SDK writes. When installing, pin runtime.command to an absolute
# interpreter that has this package (horae-sdk README, "The command").
name: ntfy
version: 0.2.0
horae: '>=0,<0.2'
description: Sends Horae notifications through ntfy, with priorities and quiet hours.
license: Apache-2.0
homepage: https://github.com/horae-dev/plugin-ntfy
provides:
  notifiers:
  - ntfy.push
permissions:
  network:
  - ntfy.sh
  secrets:
  - NTFY_TOKEN
  intents:
  - notify.push
runtime:
  protocol: mcp-stdio
  command:
  - python3
  - -m
  - horae_ntfy
